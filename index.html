<style>
:root{--primary:#0b3d91;--primary-dark:#082a66;--primary-light:#e6ecf7;--accent:#d4a017;--success:#1e7e34;--warning:#d39e00;--danger:#c82333;--info:#117a8b;--gray-100:#f8f9fa;--gray-200:#e9ecef;--gray-300:#dee2e6;--gray-600:#6c757d;--gray-800:#343a40;--radius:8px;--shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.10);--transition:all .2s ease}

body{font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:var(--gray-100);color:var(--gray-800);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}

.app-header .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px}
.app-header .brand .logo{width:40px;height:40px;background:var(--accent);border-radius:50%;display:grid;place-items:center;font-weight:bold;color:var(--primary-dark);flex-shrink:0}
.app-header .brand small{display:block;font-size:11px;font-weight:400;opacity:.8}

.app-header nav a{color:rgba(255,255,255,.85);text-decoration:none;padding:8px 14px;border-radius:var(--radius);transition:var(--transition);font-weight:500;font-size:13px;cursor:pointer;display:inline-block}

.scope-banner{background:#fff;border:1px solid var(--gray-300);border-left:4px solid var(--info);padding:10px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

#toast-container{position:fixed;top:80px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:#fff;border-left:4px solid var(--primary);border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow-md);font-size:13px;animation:slideIn .3s ease}
.toast.success{border-color:var(--success)}

@keyframes slideIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--gray-300)}

.timeline-item.done::before{background:var(--success);box-shadow:0 0 0 2px var(--success)}
.timeline-item.rejected::before{background:var(--danger);box-shadow:0 0 0 2px var(--danger)}
.timeline-item.pending::before{background:var(--gray-300);box-shadow:0 0 0 2px var(--gray-300)}
.timeline-item .tl-title{font-weight:600;color:var(--primary-dark);font-size:13px}
.timeline-item .tl-meta{font-size:12px;color:var(--gray-600);margin-top:2px}

.workflow-viz{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding:12px;background:var(--gray-100);border-radius:var(--radius);font-size:11px}

<body>
<div id="root"></div>
<div id="toast-container"></div>
<div id="modal-container"></div>
<script>
/* =====================================================
   0. CONFIGURATION DE L'API (URL DU BACKEND SUR SUGA)
   ===================================================== */
const API_BASE_URL = 'https://jvevjquns6bc-production-eyelxwya.europe-west1.suga.run';

/* =====================================================
   1. COUCHE API
   ===================================================== */
const API = (() => {
  const cache = {agents: [], directions: [], missions: [], validations: [], workflows: [], statuts: [], transports: [], typesFrais: [], users: [], destinations: [], roles: [], vehicules: [], demandesVehicules: [], statutsVehicule: []};
  const seq = { mission: 0, validation: 0, agent: 0, direction: 0, destination: 0, user: 0, role: 0, vehicule: 0, demande: 0 };
  const PAGES_CATALOG = [
    {id:'dashboard', label:'Tableau de bord'},{id:'vehicules', label:'Demandes véhicules'},{id:'validation', label:'Validations'},
    {id:'missions', label:'Missions'},{id:'parc_auto', label:'Parc auto'},{id:'agents', label:'Agents'},
    {id:'directions', label:'Directions'},{id:'destinations', label:'Destinations'},{id:'statistiques', label:'Statistiques'},
    {id:'comptes', label:'Comptes'},{id:'roles', label:'Rôles'}
  ];
  function nextId(entity) { return ++seq[entity]; }
  async function fetchJson(url, options = {}) { 
    const fullUrl = url.startsWith('/') ? API_BASE_URL + url : url;
    const r = await fetch(fullUrl, options); 
    if (!r.ok) throw new Error(`Erreur ${r.status}`); 
    return r.json(); 
  }
  async function pushCreate(entity, data) { 
    try { 
      const r = await fetch(`${API_BASE_URL}/api/${entity}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); 
      if (!r.ok) { const errText = await r.text(); console.error(`❌ POST /api/${entity} (${r.status}) :`, errText); if (window.Utils) Utils.toast(`Erreur serveur (${r.status})`, 'error', 5000); }
      else { console.log(`✅ POST /api/${entity} OK`, data); }
    } catch (e) { console.error('Erreur sync create', entity, e); } 
  }
  async function pushUpdate(entity, id, data) { 
    try { const r = await fetch(`${API_BASE_URL}/api/${entity}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) console.error(`❌ PUT /api/${entity}/${id} (${r.status})`); } catch (e) { console.error(e); } 
  }
  async function pushDelete(entity, id) { try { await fetch(`${API_BASE_URL}/api/${entity}/${id}`, { method: 'DELETE' }); } catch (e) { console.error(e); } }
  async function init() {
    const [agents, directions, destinations, missions, validations, workflows, statuts, transports, typesFrais, users, roles, vehicules, demandesVehicules, statutsVehicule] = await Promise.all([
      fetchJson('/api/agents'), fetchJson('/api/directions'), fetchJson('/api/destinations'), fetchJson('/api/missions'),
      fetchJson('/api/validations'), fetchJson('/api/workflows'), fetchJson('/api/statuts'), fetchJson('/api/transports'),
      fetchJson('/api/types-frais'), fetchJson('/api/users'), fetchJson('/api/roles'), fetchJson('/api/vehicules'),
      fetchJson('/api/demandes-vehicules'), fetchJson('/api/statuts-vehicule')
    ]);
    cache.agents = agents; cache.directions = directions; cache.destinations = destinations;
    cache.missions = missions; cache.validations = validations; cache.workflows = workflows;
    cache.statuts = statuts; cache.transports = transports; cache.typesFrais = typesFrais;
    cache.users = users; cache.roles = roles; cache.vehicules = vehicules;
    cache.demandesVehicules = demandesVehicules; cache.statutsVehicule = statutsVehicule;
    seq.mission = Math.max(0, ...missions.map(m => m.idMission || 0));
    seq.validation = Math.max(0, ...validations.map(v => v.idValidation || 0));
    seq.agent = Math.max(0, ...agents.map(a => a.idAgent || 0));
    seq.direction = Math.max(0, ...directions.map(d => d.idDirection || 0));
    seq.destination = Math.max(0, ...destinations.map(d => d.idDestination || 0));
    seq.user = Math.max(0, ...users.map(u => u.idUtilisateur || 0));
    seq.role = Math.max(0, ...roles.map(r => r.idRole || 0));
    seq.vehicule = Math.max(0, ...vehicules.map(v => v.idVehicule || 0));
    seq.demande = Math.max(0, ...demandesVehicules.map(d => d.idDemande || 0));
    console.log('✅ Données chargées depuis MySQL');
    console.log('📋 Workflows actifs :', cache.workflows.filter(w => w.actif !== 0).map(w => `id=${w.idWorkflow} code=${w.code}`).join(' | '));
  }
  return {
    PAGES_CATALOG, init,

/* =====================================================
   2. AUTHENTIFICATION
   ===================================================== */
const Auth = (() => {
  const KEY = 'gm_session';
  return {
    login(login, password) {
      const u = API.getUser(login);
      if (!u || u.password !== password) throw new Error('Identifiants invalides');
      if (u.actif === false) throw new Error('Compte désactivé');
      const s = {login:u.login, role:u.role, idAgent:u.idAgent, idUtilisateur:u.idUtilisateur, dateLogin:new Date().toISOString()};
      localStorage.setItem(KEY, JSON.stringify(s));
      try { API.updateUser(u.idUtilisateur, {dateLogin: s.dateLogin}); } catch(e) {}
      return s;
    },
    logout() { localStorage.removeItem(KEY); window.location.reload(); },
    session() { const s = localStorage.getItem(KEY); if (!s) return null; try { return JSON.parse(s); } catch { return null; } },
    currentAgent() { const s = this.session(); return s && s.idAgent ? API.getAgent(s.idAgent) : null; }
  };
})();

/* =====================================================
   3. SCOPE
   ===================================================== */
const Scope = (() => {
  const ROLES_GLOBAUX = ['ADMIN','DAF','DAAJ','SSPA'];
  const ROLES_DIRECTION = ['CHEF_SERVICE','DIRECTEUR','RELAIS'];
  const DIRECTIONS_GLOBALES = ['DAAJ', 'SSPA', 'DAF'];
  const isGlobalView = () => ROLES_GLOBAUX.includes(Auth.session()?.role);
  const isDirectionView = () => ROLES_DIRECTION.includes(Auth.session()?.role);
  function hasGlobalDirection() { const agent = Auth.currentAgent(); if (!agent) return false; const dir = API.getDirection(agent.idDirection); if (!dir) return false; return DIRECTIONS_GLOBALES.includes(dir.codeDirection); }
  function myDirectionId() { const a = Auth.currentAgent(); return a ? a.idDirection : null; }
  function directionTree(idDirection) { if (!idDirection) return []; const ids = [idDirection]; const dirs = API.getDirections(); let added = true; while (added) { added = false; dirs.forEach(d => { if (d.idDirectionParent && ids.includes(d.idDirectionParent) && !ids.includes(d.idDirection)) { ids.push(d.idDirection); added = true; } }); } return ids; }
  function visibleDirectionIds() { if (isGlobalView() || hasGlobalDirection()) return null; const dirId = myDirectionId(); if (!dirId) return []; if (isDirectionView()) return directionTree(dirId); return [dirId]; }
  function missions() {
    const all = API.getMissions();
    const role = Auth.session()?.role;
    const agent = Auth.currentAgent();
    if (isGlobalView() || hasGlobalDirection()) return all;
    if (role === 'RELAIS') { if (!agent) return []; const dirId = agent.idDirection; return all.filter(m => m.idDirection === dirId || m.idDemandeur === agent.idAgent || (m.participants || []).some(p => p.idAgent === agent.idAgent)); }
    if (isDirectionView()) { const dirIds = visibleDirectionIds() || []; return all.filter(m => dirIds.includes(m.idDirection)); }
    if (!agent) return [];
    return all.filter(m => m.idDemandeur === agent.idAgent || (m.participants || []).some(p => p.idAgent === agent.idAgent));
  }
  function demandesVehicules() {
    const all = API.getDemandesVehicules();
    const role = Auth.session()?.role;
    const agent = Auth.currentAgent();
    if (isGlobalView() || hasGlobalDirection()) return all;
    if (role === 'RELAIS') { if (!agent) return []; const dirId = agent.idDirection; return all.filter(d => d.idDirection === dirId || d.idDemandeur === agent.idAgent || d.idChauffeur === agent.idAgent); }
    if (isDirectionView()) { const dirIds = visibleDirectionIds() || []; return all.filter(d => dirIds.includes(d.idDirection)); }
    if (!agent) return [];
    return all.filter(d => d.idDemandeur === agent.idAgent || d.idChauffeur === agent.idAgent);
  }
  function agents() {
    const all = API.getAgents();
    const role = Auth.session()?.role;
    const agent = Auth.currentAgent();
    if (isGlobalView() || hasGlobalDirection()) return all;
    if (role === 'RELAIS') { if (!agent) return []; const dirId = agent.idDirection; return all.filter(a => a.idDirection === dirId); }
    if (isDirectionView()) { const dirIds = visibleDirectionIds() || []; return all.filter(a => dirIds.includes(a.idDirection)); }
    if (!agent) return [];
    return all.filter(a => a.idAgent === agent.idAgent);
  }
  function directions() { const all = API.getDirections(); if (isGlobalView() || hasGlobalDirection()) return all; const dirIds = visibleDirectionIds() || []; return all.filter(d => dirIds.includes(d.idDirection)); }
  function validationsEnAttente() { const a = Auth.currentAgent(); return a ? API.getValidationsEnAttentePour(a.idAgent) : []; }
  function getStatistiques() { const ms = missions(); const byStatut = {}, byDirection = {}; let totalJours = 0; ms.forEach(m => { const statut = API.getStatutById(m.idStatut)?.code || '?'; byStatut[statut] = (byStatut[statut] || 0) + 1; const dir = API.getDirection(m.idDirection)?.libelle || '?'; byDirection[dir] = (byDirection[dir] || 0) + 1; totalJours += Utils.dureeJours(m.dateDepart, m.dateRetour); }); return {total: ms.length, byStatut, byDirection, totalJours}; }
  function vehiculesParc() { const all = API.getVehicules().filter(v => v.actif !== false); if (isGlobalView() || hasGlobalDirection()) return all; const dirIds = visibleDirectionIds() || []; return all.filter(v => dirIds.includes(v.idDirection)); }
  function label() {
    const r = Auth.session()?.role;
    if (r === 'ADMIN') return {cls:'scope-global', icon:'🌐', text:'Vue <strong>Administrateur</strong>'};
    if (r === 'DAF') return {cls:'scope-global', icon:'🌐', text:'Vue <strong>DAF</strong>'};
    if (r === 'DAAJ') return {cls:'scope-global', icon:'⚖️', text:'Vue <strong>DAAJ</strong>'};
    if (r === 'SSPA') return {cls:'scope-global', icon:'📋', text:'Vue <strong>SSPA</strong>'};
    if (r === 'DIRECTEUR') { const d = API.getDirection(myDirectionId()); const dirLbl = d ? `${d.codeDirection} — ${d.libelle}` : '—'; return {cls:'scope-direction', icon:'👔', text:`Vue <strong>Directeur</strong> — ${Utils.esc(dirLbl)}`}; }
    if (r === 'RELAIS') { const d = API.getDirection(myDirectionId()); const dirLbl = d ? `${d.codeDirection} — ${d.libelle}` : '—'; return {cls:'scope-direction', icon:'📋', text:`Vue <strong>Relais</strong> — ${Utils.esc(dirLbl)}`}; }
    if (r === 'AGENT') return {cls:'scope-self', icon:'👤', text:'Vue <strong>Agent</strong>'};
    return {cls:'', icon:'', text:''};
  }
  return {isGlobalView, isDirectionView, hasGlobalDirection, myDirectionId, visibleDirectionIds, missions, demandesVehicules, agents, directions, validationsEnAttente, getStatistiques, label, vehiculesParc};
})();

/* =====================================================
   4. UTILITAIRES
   ===================================================== */
const Utils = {
  formatDate(d) { if (!d) return '—'; if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) { const [y, m, j] = d.substring(0,10).split('-'); return `${j}/${m}/${y}`; } const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR'); },
  formatDateTime(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}); },
  toLocalInput(d) { if (!d) return ''; const dt = new Date(d); if (isNaN(dt)) return ''; const pad = (n) => String(n).padStart(2,'0'); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`; },
  formatMoney(v) { const n = Number(v || 0); return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MAD'; },
  dureeJours(d1, d2) { if (!d1 || !d2) return 0; const a = new Date(d1), b = new Date(d2); if (isNaN(a) || isNaN(b)) return 0; const diff = b - a; if (diff < 0) return 0; return Math.floor(diff / (1000*60*60*24)) + 1; },
  esc(s) { if (s == null) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); },
  destsLabel(d) { if (!d) return '—'; const arr = Array.isArray(d.destinations) && d.destinations.length ? d.destinations : (d.destination ? [d.destination] : []); return arr.length ? arr.join(' → ') : '—'; },
  personnesList(d) { if (!d) return []; if (Array.isArray(d.personnesTransportees)) return d.personnesTransportees.map(p => String(p || '').trim()).filter(Boolean); return []; },
  statutCode(m) { return API.getStatutById(m.idStatut)?.code || '?'; },
  statutLibelle(m) { return API.getStatutById(m.idStatut)?.libelle || '?'; },
  badgeStatut(m) { return `<span class="badge badge-${this.statutCode(m)}">${this.esc(this.statutLibelle(m))}</span>`; },
  badgeStatutVehicule(code) { const s = API.getStatutVehiculeByCode(code); return `<span class="badge badge-${code}">${this.esc(s?.libelle || code)}</span>`; },
  agentNom(id) { const a = API.getAgent(id); return a ? `${a.prenom} ${a.nom}` : '—'; },
  vehiculeLabel(id) { if (!id) return '—'; const v = API.getVehicule(id); return v ? `${v.immatriculation}` : '—'; },
  demandeurCell(idAgent) { const a = idAgent ? API.getAgent(idAgent) : null; if (!a) return '<span class="text-muted">—</span>'; const dir = API.getDirection(a.idDirection); const initiales = ((a.prenom||'').charAt(0) + (a.nom||'').charAt(0)).toUpperCase() || '?'; return `<div class="demandeur-cell"><div class="demandeur-avatar">${this.esc(initiales)}</div><div class="demandeur-info"><div class="demandeur-nom">${this.esc(a.prenom + ' ' + a.nom)}</div><div class="demandeur-meta">${a.matricule || ''} ${dir ? ' • ' + dir.codeDirection : ''}</div></div></div>`; },
  demandeurHighlight(idAgent, titre = 'Demandeur') { const a = idAgent ? API.getAgent(idAgent) : null; if (!a) return ''; const dir = API.getDirection(a.idDirection); const initiales = ((a.prenom||'').charAt(0) + (a.nom||'').charAt(0)).toUpperCase() || '?'; return `<div class="demandeur-highlight"><div class="dh-avatar">${this.esc(initiales)}</div><div class="dh-info"><div class="dh-name">👤 ${this.esc(titre)} : ${this.esc(a.prenom + ' ' + a.nom)}</div><div class="dh-meta">${a.matricule ? `<strong>Matricule :</strong> ${this.esc(a.matricule)}` : ''}${a.fonction ? ` • <strong>Fonction :</strong> ${this.esc(a.fonction)}` : ''}${dir ? `<br><strong>Direction :</strong> ${this.esc(dir.codeDirection)}` : ''}${a.telephone ? `<br><strong>Téléphone :</strong> ${this.esc(a.telephone)}` : ''}</div></div></div>`; },
  toast(msg, type='success', dur=3500) { let c = document.getElementById('toast-container'); const el = document.createElement('div'); el.className = 'toast ' + type; el.innerHTML = `<strong>${type==='error'?'✗':type==='warning'?'⚠':type==='info'?'ℹ':'✓'}</strong> ${this.esc(msg)}`; c.appendChild(el); setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, dur); },
  confirm(msg) { return window.confirm(msg); },
  scopeBanner() { const info = Scope.label(); if (!info.text) return ''; return `<div class="scope-banner ${info.cls}"><span class="scope-icon">${info.icon}</span><span>${info.text}</span></div>`; },
  datalist(id, values) { if (!values || !values.length) return `<datalist id="${id}"></datalist>`; return `<datalist id="${id}">${values.map(v => `<option value="${Utils.esc(v)}"></option>`).join('')}</datalist>`; },
  addDatalistOption(inputId, datalistId) {

    if (!valeur || !valeur.trim()) return;
    const v = valeur.trim();
    if (!Array.from(datalist.options).find(opt => opt.value.toLowerCase() === v.toLowerCase())) {
      const option = document.createElement('option'); option.value = v; datalist.appendChild(option);
    }
    input.value = v;
    Utils._persistDatalistValue(datalistId, v);
    Utils.toast(`"${v}" ajouté`, 'success', 2000);
  },
  _persistDatalistValue(datalistId, valeur) {
    if (datalistId === 'dl-mission-lieu-principal' || datalistId === 'dl-mission-lieu-depart' || datalistId === 'dl-dv-destinations') {
      Utils._creerDestination(valeur);
    }
  },
  _creerDestination(libelle) {
    if (API.getDestinationByLibelle(libelle)) return;
    const code = libelle.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]/g, '').substring(0, 20) || ('DEST' + Date.now());
    try { API.createDestination({ code, libelle, ville: libelle, pays: 'Maroc', region: '', distanceRef: 0, actif: true }); } catch (e) {}
  },
  inputWithPlus(inputId, datalistId, placeholder, value = '', required = false) {
    return `<div style="display:flex;gap:6px;"><input type="text" id="${inputId}" class="form-control" list="${datalistId}" placeholder="${placeholder}" ${required ? 'required' : ''} value="${Utils.esc(value || '')}" style="flex:1"><button type="button" class="btn btn-success" onclick="Utils.addDatalistOption('${inputId}', '${datalistId}')" style="padding:0 12px;font-size:16px;font-weight:bold;">+</button></div>`;
  }
};

/* =====================================================

const Printer = (() => {
  function _imprimerHtml(html) {
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';

const Excel = (() => {
  function exporter(tableau, nomFichier, nomFeuille = 'Données') {
    if (!tableau || !tableau.length) { Utils.toast('Aucune donnée', 'warning'); return; }
    const ws = XLSX.utils.json_to_sheet(tableau);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, nomFeuille);
    XLSX.writeFile(wb, `${nomFichier}_${new Date().toISOString().substring(0,10)}.xlsx`);
    Utils.toast(`Export réussi`, 'success');
  }
  function agentsVersLignes() { return Scope.agents().map(a => { const dir = API.getDirection(a.idDirection); return {'Matricule':a.matricule,'Nom':a.nom,'Prénom':a.prenom,'Fonction':a.fonction,'Taux':a.taux||0,'Direction':dir?.codeDirection||'','Email':a.email,'Téléphone':a.telephone||'','Statut':a.actif?'Actif':'Inactif'}; }); }
  function directionsVersLignes() { return Scope.directions().map(d => ({'Code':d.codeDirection,'Libellé':d.libelle,'Statut':d.actif?'Active':'Inactive'})); }
  function destinationsVersLignes() { return API.getDestinations().map(d => ({'Code':d.code,'Libellé':d.libelle,'Ville':d.ville||'','Pays':d.pays||'','Statut':d.actif?'Active':'Inactive'})); }
  function missionsVersLignes() { return Scope.missions().map(m => ({'N° OM':m.numeroOm,'Objet':m.objet,'Date départ':m.dateDepart,'Date retour':m.dateRetour,'Durée':Utils.dureeJours(m.dateDepart, m.dateRetour),'Statut':Utils.statutLibelle(m)})); }
  function demandesVehiculesVersLignes() { return Scope.demandesVehicules().map(d => ({'N° Demande':d.numeroDemande,'Objet':d.objet,'Demandeur':Utils.agentNom(d.idDemandeur),'Destinations':Utils.destsLabel(d),'Statut':API.getStatutVehiculeByCode(d.statut)?.libelle||d.statut})); }
  function parcAutoVersLignes() { return Scope.vehiculesParc().map(v => { const dir = API.getDirection(v.idDirection); return {'Matricule':v.immatriculation,'Marque':v.marque,'Modèle':v.modele,'Direction':dir?dir.codeDirection:'—','Statut':v.statut||''}; }); }
  function statistiquesVersLignes() { const s = Scope.getStatistiques(); return [{'Indicateur':'Total missions','Valeur':s.total},{'Indicateur':'Jours cumulés','Valeur':s.totalJours}]; }
  return {exporter, agentsVersLignes, directionsVersLignes, destinationsVersLignes, missionsVersLignes, demandesVehiculesVersLignes, parcAutoVersLignes, statistiquesVersLignes};
})();

    const root = document.getElementById('root');

    const agent = Auth.currentAgent(); const nom = agent ? `${agent.prenom} ${agent.nom}` : session.login;
    const pages = visiblePages(); if (!pages.some(p => p.id === currentPage)) currentPage = pages[0]?.id || 'dashboard';
    root.innerHTML = `<header class="app-header"><div class="brand"><div class="logo">GM</div><div><div>Gestion des Missions</div><small>Administration Publique</small></div></div><nav><ul>${pages.map(p => `<li><a data-page="${p.id}" class="${p.id===currentPage?'active':''}">${p.label}</a></li>`).join('')}</ul></nav><div class="user-info"><div class="avatar">${(nom.charAt(0)||'?').toUpperCase()}</div><div><div class="info-name">${Utils.esc(nom)}</div><div class="info-role">${Utils.esc(session.role)}</div></div><button class="btn btn-sm" style="background:rgba(255,255,255,.15)" onclick="App.logout()">Déconnexion</button></div></header><main class="container" id="page-content"></main><footer class="app-footer">© ${new Date().getFullYear()} DAAJ</footer>`;

  validation() { const session = Auth.session(); const hasAgent = !!session?.idAgent; const enAttente = Scope.validationsEnAttente(); const historique = hasAgent ? API.getValidations().filter(v => v.idValidateur === session.idAgent && v.decision !== 'EN_ATTENTE').sort((a,b) => (b.dateDecision||'').localeCompare(a.dateDecision||'')) : []; return `${Utils.scopeBanner()}<div class="page-title"><div><h1>Circuit de validation</h1></div></div><div class="card"><div class="card-header"><h2>Validations en attente</h2><span class="badge badge-SOUMIS">${enAttente.length}</span></div><div>${!hasAgent ? '<div class="alert alert-warning">Compte non relié</div>' : enAttente.length === 0 ? '<div class="alert alert-info">Aucune validation 🎉</div>' : enAttente.map(v => { const m = API.getMission(v.idMission); if (!m) return ''; const wf = API.getWorkflow(m.idWorkflow); return `<div class="card" style="border-left:4px solid var(--warning);margin-bottom:14px"><div class="flex-between"><div><strong style="color:var(--primary-dark);font-size:15px">${Utils.esc(m.numeroOm)}</strong><div style="margin-top:4px">${Utils.esc(m.objet)}</div><div class="text-muted" style="margin-top:6px;font-size:12px"><strong>Étape ${v.niveau}/${wf?.etapes?.length||'?'}</strong> — ${Utils.esc(v.libelleEtape||'')}</div>${Actions.workflowViz(m.idMission)}</div><div class="actions-cell"><button class="btn btn-sm btn-success" onclick="Actions.openAction(${v.idValidation})">Traiter</button><button class="btn btn-sm btn-outline" onclick="Actions.detail(${m.idMission})">Voir</button></div></div></div>`; }).join('')}</div></div><div class="card"><div class="card-header"><h2>Historique</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Mission</th><th>Objet</th><th>Niveau</th><th>Décision</th><th>Date</th><th>OM</th></tr></thead><tbody>${historique.length ? historique.map(v => { const m = API.getMission(v.idMission); if (!m) return ''; const canPrintOM = ['OM_ETABLI','VALIDE','EN_COURS','CLOTURE'].includes(Utils.statutCode(m)); return `<tr><td><strong>${Utils.esc(m.numeroOm)}</strong></td><td>${Utils.esc((m.objet||'').substring(0,45))}</td><td>Niveau ${v.niveau}</td><td>${Utils.esc(v.decision)}</td><td>${Utils.formatDateTime(v.dateDecision)}</td><td>${canPrintOM ? `<button class="om-icon-btn" onclick="Printer.previsualiserOrdreMission(${m.idMission})"></button>` : '—'}</td></tr>`; }).join('') : '<tr><td colspan="6" class="text-center text-muted">Aucun historique</td></tr>'}</tbody></table></div></div>`; },

r="N°, objet, demandeur..."></div><div class="form-group" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="Actions.resetFiltresVehicules()">Réinitialiser</button></div></div></div><div class="card"><div class="table-wrapper"><table class="data-table"><thead><tr><th>N°</th><th>Objet</th><th>Demandeur</th><th>Destination(s)</th><th>Départ</th><th>Retour</th><th>Personnes</th><th>Statut</th><th>Bon</th><th>Actions</th></tr></thead><tbody id="vehicules-tbody"></tbody></table></div></div>`; },

tresParcAuto()">Réinitialiser</button></div></div></div><div class="card"><div class="card-header"><h2>Liste</h2><span class="badge badge-SOUMIS" id="parc-auto-count">${vehicules.length} véhicule(s)</span></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Matricule</th><th>Marque</th><th>Modèle</th><th>Type</th><th>Carburant</th><th>Direction</th><th>Utilisateur</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="parc-auto-tbody"></tbody></table></div></div>`; },
  agents() { const agents = Scope.agents(); const actifs = agents.filter(a => a.actif).length; return `${Utils.scopeBanner()}<div class="page-title"><div><h1>Agents</h1></div><div class="actions-cell"><button class="btn btn-outline" onclick="Excel.exporter(Excel.agentsVersLignes(),'agents','Agents')">📤 Exporter</button><button class="btn btn-info" onclick="Printer.imprimerListeAgents(Scope.agents())">🖨️ Imprimer</button><button class="btn" onclick="Actions.nouvelAgent()">+ Nouvel agent</button></div></div><div class="kpi-grid"><div class="kpi"><div class="kpi-label">Total</div><div class="kpi-value">${agents.length}</div></div><div class="kpi kpi-success"><div class="kpi-label">Actifs</div><div class="kpi-value">${actifs}</div></div><div class="kpi kpi-danger"><div class="kpi-label">Inactifs</div><div class="kpi-value">${agents.length - actifs}</div></div></div><div class="card"><div class="form-grid"><div class="form-group"><label>Recherche</label><input type="text" id="filter-agent" class="form-control" placeholder="Nom, matricule..."></div><div class="form-group"><label>Direction</label><select id="filter-agent-direction" class="form-control"><option value="">Toutes</option>${Scope.directions().map(d => `<option value="${d.idDirection}">${Utils.esc(d.codeDirection)}</option>`).join('')}</select></div><div class="form-group"><label>Statut</label><select id="filter-agent-statut" class="form-control"><option value="">Tous</option><option value="actif">Actifs</option><option value="inactif">Inactifs</option></select></div><div class="form-group" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="Actions.resetFiltresAgents()">Réinitialiser</button></div></div></div><div class="card"><div class="card-header"><h2>Liste</h2><span class="badge badge-SOUMIS" id="agents-count">${agents.length} agent(s)</span></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Matricule</th><th>Nom</th><th>Fonction</th><th>Taux</th><th>Direction</th><th>Email</th><th>Téléphone</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="agents-tbody"></tbody></table></div></div>`; },
  directions() { return `${Utils.scopeBanner()}<div class="page-title"><div><h1>Directions</h1></div><div class="actions-cell"><button class="btn btn-outline" onclick="Excel.exporter(Excel.directionsVersLignes(),'directions','Directions')">📤 Exporter</button><button class="btn" onclick="Actions.nouvelleDirection()">+ Nouvelle</button></div></div><div class="card"><div class="form-group"><label>Recherche</label><input type="text" id="filter-direction" class="form-control"></div></div><div class="card"><div class="table-wrapper"><table class="data-table"><thead><tr><th>Code</th><th>Libellé</th><th>Nb agents</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="directions-tbody"></tbody></table></div></div>`; },
  destinations() { return `${Utils.scopeBanner()}<div class="page-title"><div><h1>Destinations</h1></div><div class="actions-cell"><button class="btn btn-outline" onclick="Excel.exporter(Excel.destinationsVersLignes(),'destinations','Destinations')">📤 Exporter</button><button class="btn" onclick="Actions.nouvelleDestination()">+ Nouvelle</button></div></div><div class="card"><div class="form-group"><label>Recherche</label><input type="text" id="filter-destination" class="form-control"></div></div><div class="card"><div class="table-wrapper"><table class="data-table"><thead><tr><th>Code</th><th>Libellé</th><th>Ville</th><th>Pays</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="destinations-tbody"></tbody></table></div></div>`; },
  statistiques() { const stats = Scope.getStatistiques(); return `${Utils.scopeBanner()}<div class="page-title"><div><h1>Statistiques</h1></div></div><div class="kpi-grid"><div class="kpi"><div class="kpi-label">Total</div><div class="kpi-value">${stats.total}</div></div><div class="kpi kpi-info"><div class="kpi-label">Jours cumulés</div><div class="kpi-value">${stats.totalJours}</div></div></div><div class="card"><div class="card-header"><h2>Par statut</h2></div><canvas id="chart-statut" height="220"></canvas></div><div class="card"><div class="card-header"><h2>Par direction</h2></div><canvas id="chart-direction" height="220"></canvas></div>`; },
  comptes() { return `${Utils.scopeBanner()}<div class="page-title"><div><h1>Comptes</h1></div><div class="actions-cell"><button class="btn" onclick="Actions.openCompteModal(null)">+ Nouveau</button></div></div><div class="card"><div class="form-grid"><div class="form-group"><label>Recherche</label><input type="text" id="filter-compte" class="form-control"></div><div class="form-group"><label>Rôle</label><select id="filter-compte-role" class="form-control"><option value="">Tous</option>${API.getRoles().map(r => `<option value="${Utils.esc(r.code)}">${Utils.esc(r.libelle)}</option>`).join('')}</select></div><div class="form-group" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="Actions.resetFiltresComptes()">Réinitialiser</button></div></div></div><div class="card"><div class="table-wrapper"><table class="data-table"><thead><tr><th>Login</th><th>Nom</th><th>Rôle</th><th>Agent</th><th>Dernière connexion</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="comptes-tbody"></tbody></table></div></div>`; },

/* =====================================================
   9. ACTIONS
   ===================================================== */
const Actions = {
  resetFiltres() { ['filter-statut','filter-mission-direction','filter-search'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; }); Actions.renderMissions(); },
  resetFiltresVehicules() { ['filter-veh-statut','filter-veh-direction','filter-veh-search'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; }); Actions.renderVehicules(); },
  resetFiltresParcAuto() { ['filter-parc-auto','filter-parc-auto-statut','filter-parc-auto-direction'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; }); Actions.renderParcAuto(); },
  resetFiltresAgents() { ['filter-agent','filter-agent-direction','filter-agent-statut'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; }); Actions.renderAgents(); },
  resetFiltresComptes() { ['filter-compte','filter-compte-role'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; }); Actions.renderComptes(); },

  workflowViz(idMission) {
    const m = API.getMission(idMission); if (!m) return '';
    const wf = API.getWorkflow(m.idWorkflow); if (!wf || !wf.etapes) return '';
    const vals = API.getValidationsByMission(idMission);
    const steps = wf.etapes.map(e => {
      const v = vals.find(x => x.niveau === e.niveau);
      let cls = '';
      if (v) { if (v.decision === 'VALIDE') cls = 'done'; else if (v.decision === 'REJETE') cls = 'rejected'; else if (v.decision === 'EN_ATTENTE') cls = 'current'; }
      return `<div class="step ${cls}"><span class="num">${e.niveau}</span><span>${Utils.esc(e.libelle.substring(0,30))}</span></div>`;
    }).join('<span class="arrow">→</span>');
    return `<div class="workflow-viz">${steps}</div>`;
  },

  renderMissions() {
    const tbody = document.getElementById('missions-tbody'); if (!tbody) return;
    const fStatut = document.getElementById('filter-statut')?.value || '';
    const fDir = document.getElementById('filter-mission-direction')?.value || '';
    const fSearch = (document.getElementById('filter-search')?.value || '').trim().toLowerCase();
    let list = Scope.missions();
    if (fStatut) list = list.filter(m => String(m.idStatut) === fStatut);
    if (fDir) list = list.filter(m => m.idDirection == fDir);
    if (fSearch) list = list.filter(m => (m.numeroOm||'').toLowerCase().includes(fSearch) || (m.objet||'').toLowerCase().includes(fSearch));
    list.sort((a,b) => (b.dateEmission||'').localeCompare(a.dateEmission||''));
    if (!list.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted" style="padding:30px">Aucune mission</td></tr>'; return; }
    tbody.innerHTML = list.map(m => {
      const demandeur = API.getAgent(m.idDemandeur);
      const direction = API.getDirection(m.idDirection);
      const statutCode = Utils.statutCode(m);
      const canPrintOM = ['OM_ETABLI','VALIDE','EN_COURS','CLOTURE'].includes(statutCode);
      return `<tr><td><strong>${Utils.esc(m.numeroOm)}</strong></td><td>${Utils.esc((m.objet||'').substring(0,45))}</td><td>${direction ? Utils.esc(direction.codeDirection) : '—'}</td><td>${demandeur ? Utils.esc(demandeur.prenom + ' ' + demandeur.nom) : '—'}</td><td>${Utils.formatDate(m.dateDepart)}</td><td>${Utils.formatDate(m.dateRetour)}</td><td>${Utils.badgeStatut(m)}</td><td style="text-align:center">${canPrintOM ? `<button class="om-icon-btn" onclick="Printer.previsualiserOrdreMission(${m.idMission})"></button>` : '—'}</td><td><button class="btn btn-sm btn-outline" onclick="Actions.detail(${m.idMission})">Détail</button></td></tr>`;
    }).join('');
  },

  detail(idMission) {
    const m = API.getMission(idMission); if (!m) return;
    const demandeur = API.getAgent(m.idDemandeur);
    const validations = API.getValidationsByMission(idMission);
    const participants = (m.participants || []).map(p => { const a = API.getAgent(p.idAgent); return a ? {...a, roleMission: p.roleMission} : null; }).filter(Boolean);
    const statutCode = Utils.statutCode(m);
    const canPrintOM = ['OM_ETABLI','VALIDE','EN_COURS','CLOTURE'].includes(statutCode);
    App.openModal(`
      <div class="modal-overlay active"><div class="modal modal-wide">
        <div class="modal-header"><h3>📋 ${Utils.esc(m.numeroOm)}</h3><button class="modal-close" onclick="App.closeModal()">×</button></div>
        <div class="modal-body">
          <div class="flex-between" style="margin-bottom:16px"><h3>${Utils.esc(m.objet)}</h3>${Utils.badgeStatut(m)}</div>
          <div class="form-grid" style="margin-bottom:20px">
            <div><strong>Demandeur :</strong><br>${demandeur ? Utils.esc(demandeur.prenom + ' ' + demandeur.nom) : '—'}</div>
            <div><strong>Période :</strong><br>${Utils.formatDate(m.dateDepart)} → ${Utils.formatDate(m.dateRetour)}</div>
            <div><strong>Destination :</strong><br>${Utils.esc(m.lieuPrincipal || '—')}</div>
          </div>
          <h4>👥 Participants (${participants.length})</h4>
          <div class="table-wrapper" style="margin-top:10px"><table class="data-table"><thead><tr><th>Nom</th><th>Matricule</th><th>Fonction</th><th>Téléphone</th><th>Direction</th></tr></thead><tbody>${participants.length ? participants.map(p => { const dirP = API.getDirection(p.idDirection); return `<tr><td><strong>${Utils.esc(p.prenom + ' ' + p.nom)}</strong></td><td>${Utils.esc(p.matricule || '—')}</td><td>${Utils.esc(p.fonction || '—')}</td><td>📞 ${Utils.esc(p.telephone || '—')}</td><td>${dirP ? Utils.esc(dirP.codeDirection) : '—'}</td></tr>`; }).join('') : '<tr><td colspan="5" class="text-center">Aucun</td></tr>'}</tbody></table></div>
          ${validations.length ? `<h4 style="margin-top:20px">📜 Historique</h4><div class="timeline" style="margin-top:14px">${validations.map(v => { const cls = v.decision === 'VALIDE' ? 'done' : v.decision === 'REJETE' ? 'rejected' : 'pending'; const isEtapeSSPA = v.decision === 'VALIDE' && v.libelleEtape && v.libelleEtape.toLowerCase().includes('établissement'); return `<div class="timeline-item ${cls}"><div class="tl-title">Niveau ${v.niveau} — ${Utils.esc(v.libelleEtape||'')} ${isEtapeSSPA && canPrintOM ? `<button class="om-icon-btn" style="margin-inline-start:8px" onclick="Printer.previsualiserOrdreMission(${idMission})"></button>` : ''}</div><div class="tl-meta">${Utils.esc(Utils.agentNom(v.idValidateur))} — <strong>${Utils.esc(v.decision)}</strong></div></div>`; }).join('')}</div>` : ''}
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="App.closeModal()">Fermer</button>${canPrintOM ? `<button class="btn btn-info" onclick="Printer.previsualiserOrdreMission(${idMission})">📄 Aperçu OM</button>` : ''}</div>
      </div></div>`);
  },

  nouvelleMission() {
    const session = Auth.session();
    const agent = Auth.currentAgent();
    if (!session?.idAgent) { Utils.toast('Compte non relié à un agent', 'error'); return; }
    const directions = Scope.directions();
    const agents = API.getAgents().filter(a => a.actif);
    const valLieuDepart = ['Rabat', 'Casablanca', 'Marrakech', 'Fès', 'Tanger', 'Agadir'];
    const valLieuPrincipal = API.getDestinations().map(d => d.libelle);
    App.openModal(`
      <div class="modal-overlay active"><div class="modal modal-wide">
        <div class="modal-header"><h3>➕ Nouvelle mission</h3><button class="modal-close" onclick="App.closeModal()">×</button></div>
        <div class="modal-body">
          ${Utils.datalist('dl-mission-lieu-depart', valLieuDepart)}
          ${Utils.datalist('dl-mission-lieu-principal', valLieuPrincipal)}
          <form id="form-mission">
            <div class="form-grid">
              <div class="form-group full-width"><label>Objet <span class="required">*</span></label><input type="text" id="m-objet" class="form-control" required></div>
              <div class="form-group"><label>Direction <span class="required">*</span></label><select id="m-direction" class="form-control" required>${directions.map(d => `<option value="${d.idDirection}" ${agent && agent.idDirection === d.idDirection ? 'selected' : ''}>${Utils.esc(d.codeDirection)}</option>`).join('')}</select></div>
              <div class="form-group"><label>Date d'émission <span class="required">*</span></label><input type="date" id="m-date-emission" class="form-control" required value="${new Date().toISOString().substring(0,10)}"></div>
              <div class="form-group"><label>Lieu de départ <span class="required">*</span></label>${Utils.inputWithPlus('m-lieu-depart', 'dl-mission-lieu-depart', 'Saisir...', 'Rabat', true)}</div>
              <div class="form-group"><label>Destination principale <span class="required">*</span></label>${Utils.inputWithPlus('m-lieu-principal', 'dl-mission-lieu-principal', 'Saisir...', '', true)}</div>
              <div class="form-group"><label>Date départ <span class="required">*</span></label><input type="datetime-local" id="m-date-depart" class="form-control" required></div>
              <div class="form-group"><label>Date retour <span class="required">*</span></label><input type="datetime-local" id="m-date-retour" class="form-control" required></div>
              <div class="form-group"><label>Budget (MAD)</label><input type="number" id="m-budget" class="form-control" value="0"></div>
              <div class="form-group"><label>Pays</label><input type="text" id="m-pays" class="form-control" value="Maroc"></div>
            </div>
            <h4 style="margin-top:24px;color:var(--primary-dark)">👥 Participants</h4>
            <div style="background:var(--gray-100);padding:12px;border-radius:8px;margin-bottom:12px">
              <input type="text" id="m-part-search" class="form-control" placeholder="🔍 Rechercher par nom, prénom, matricule, fonction..." autocomplete="off" style="margin-bottom:6px">
              <select id="m-part-select" class="form-control" size="5" style="height:auto"><option value="">— Sélectionner —</option>${agents.map(a => `<option value="${a.idAgent}">${Utils.esc(a.prenom + ' ' + a.nom)} (${Utils.esc(a.matricule)}) — ${Utils.esc(a.fonction || '')}</option>`).join('')}</select>
              <small class="text-muted" id="m-part-count-hint" style="display:block;margin-top:6px">${agents.length} agent(s) disponible(s)</small>
              <button type="button" class="btn btn-success mt-2" onclick="Actions.missionAddParticipantFromSelect()">+ Ajouter</button>
              <button type="button" class="btn btn-outline mt-2" onclick="Actions.missionAddSelf()">+ Moi-même</button>
            </div>
            <div id="m-participants-list" style="border:1px solid var(--gray-200);border-radius:8px;padding:10px;min-height:60px"><div class="text-muted" style="text-align:center;padding:16px">Aucun participant</div></div>
          </form>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button><button class="btn btn-success" onclick="Actions.saveMission(true)">Enregistrer &amp; Soumettre</button></div>
      </div></div>`);

    const searchInput = document.getElementById('m-part-search');
    const selectAgent = document.getElementById('m-part-select');
    const countHint = document.getElementById('m-part-count-hint');
    if (searchInput && selectAgent) {
      const allAgents = agents.map(a => ({ value: String(a.idAgent), label: `${a.prenom} ${a.nom} (${a.matricule}) — ${a.fonction || ''}`, search: `${a.prenom} ${a.nom} ${a.matricule} ${a.fonction || ''} ${a.grade || ''} ${a.affectation || ''}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') }));
      const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      searchInput.addEventListener('input', () => {
        const q = norm(searchInput.value.trim());
        const sv = selectAgent.value;
        const filtres = allAgents.filter(o => !q || norm(o.search).includes(q));
        selectAgent.innerHTML = `<option value="">— Sélectionner un agent —</option>` + filtres.map(o => `<option value="${o.value}" ${o.value === sv ? 'selected' : ''}>${Utils.esc(o.label)}</option>`).join('');
        if (countHint) countHint.textContent = `${filtres.length} / ${allAgents.length} agent(s)`;
        if (filtres.length === 1 && !sv) selectAgent.value = filtres[0].value;
      });
      setTimeout(() => searchInput.focus(), 100);
    }

    Actions._missionParticipants = [];
    if (agent) Actions.missionAddParticipantToList({ idAgent: agent.idAgent, roleMission: 'CHEF_MISSION', ordrePassage: 1 });
  },

  missionAddParticipantToList(data) {
    if (!Actions._missionParticipants) Actions._missionParticipants = [];
    if (Actions._missionParticipants.find(p => p.idAgent === data.idAgent)) { Utils.toast('Déjà dans la liste', 'warning'); return; }
    const agent = API.getAgent(data.idAgent);
    const direction = agent ? API.getDirection(agent.idDirection) : null;
    data.telephone = agent ? (agent.telephone || '—') : '—';
    data.directionAffectation = direction ? direction.codeDirection : '—';
    Actions._missionParticipants.push(data);
    Actions.renderMissionParticipants();
  },

  missionAddParticipantFromSelect() {
    const sel = document.getElementById('m-part-select');
    if (!sel || !sel.value) { Utils.toast('Sélectionnez un agent', 'warning'); return; }
    const idAgent = Number(sel.value);
    const a = API.getAgent(idAgent); if (!a) return;
    const role = confirm(`Rôle de ${a.prenom} ${a.nom} ?\nOK = Chef\nAnnuler = Membre`) ? 'CHEF_MISSION' : 'MEMBRE';
    Actions.missionAddParticipantToList({ idAgent, roleMission: role, ordrePassage: (Actions._missionParticipants || []).length + 1 });
    sel.value = '';
    const si = document.getElementById('m-part-search'); if (si) si.value = '';
  },

  missionAddSelf() {
    const agent = Auth.currentAgent();
    if (!agent) return;
    Actions.missionAddParticipantToList({ idAgent: agent.idAgent, roleMission: 'MEMBRE', ordrePassage: (Actions._missionParticipants || []).length + 1 });
  },

  renderMissionParticipants() {
    const list = document.getElementById('m-participants-list'); if (!list) return;
    const participants = Actions._missionParticipants || [];
    if (!participants.length) { list.innerHTML = '<div class="text-muted" style="text-align:center;padding:16px">Aucun participant</div>'; return; }
    list.innerHTML = participants.map(p => {
      const a = API.getAgent(p.idAgent); if (!a) return '';
      const dir = API.getDirection(a.idDirection);
      const init = ((a.prenom||'').charAt(0) + (a.nom||'').charAt(0)).toUpperCase();
      return `<div style="display:flex;gap:10px;padding:8px;border-bottom:1px solid var(--gray-200);align-items:center">
        <div class="demandeur-avatar" style="width:36px;height:36px">${Utils.esc(init)}</div>
        <div style="flex:1"><div style="font-weight:600;color:var(--primary-dark)">${Utils.esc(a.prenom + ' ' + a.nom)}</div><div class="text-muted" style="font-size:11px">${Utils.esc(a.matricule || '')} • ${dir ? Utils.esc(dir.codeDirection) : '—'}</div><div style="font-size:11px;color:#0b3d91;margin-top:4px">📞 ${Utils.esc(a.telephone || '—')}</div></div>
        <select onchange="Actions.missionChangeParticipantRole(${p.idAgent}, this.value)" style="padding:5px;border-radius:5px;border:1px solid var(--gray-300);font-size:12px"><option value="CHEF_MISSION" ${p.roleMission==='CHEF_MISSION'?'selected':''}>👑 Chef</option><option value="MEMBRE" ${p.roleMission==='MEMBRE'?'selected':''}>👤 Membre</option><option value="CHAUFFEUR" ${p.roleMission==='CHAUFFEUR'?'selected':''}>🚗 Chauffeur</option></select>
        <button type="button" class="btn btn-sm btn-danger" onclick="Actions.missionRemoveParticipant(${p.idAgent})">×</button>
      </div>`;
    }).join('');
  },

  missionChangeParticipantRole(idAgent, newRole) { const p = (Actions._missionParticipants || []).find(x => x.idAgent === idAgent); if (p) p.roleMission = newRole; },
  missionRemoveParticipant(idAgent) { Actions._missionParticipants = (Actions._missionParticipants || []).filter(x => x.idAgent !== idAgent); Actions.renderMissionParticipants(); },

  saveMission(submit = false) {
    const form = document.getElementById('form-mission');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const session = Auth.session(); if (!session?.idAgent) return;
    const dateDepart = document.getElementById('m-date-depart').value;
    const dateRetour = document.getElementById('m-date-retour').value;
    if (!dateDepart || !dateRetour || dateRetour <= dateDepart) { Utils.toast('Dates invalides', 'error'); return; }
    const participants = Actions._missionParticipants || [];
    if (!participants.length) { Utils.toast('Au moins un participant', 'error'); return; }
    const payload = {
      objet: document.getElementById('m-objet').value.trim(),
      dateEmission: document.getElementById('m-date-emission').value,
      dateDepart, dateRetour,
      lieuDepart: document.getElementById('m-lieu-depart').value.trim(),
      lieuPrincipal: document.getElementById('m-lieu-principal').value.trim(),
      pays: document.getElementById('m-pays').value.trim() || 'Maroc',
      budgetPrevisionnel: Number(document.getElementById('m-budget').value) || 0,
      idDemandeur: session.idAgent,
      idDirection: Number(document.getElementById('m-direction').value),
      idWorkflow: API.getWorkflowByCode('WF_STANDARD')?.idWorkflow || 6,
      participants: participants.map((p, i) => ({ idAgent: p.idAgent, roleMission: p.roleMission, ordrePassage: i + 1, telephone: p.telephone || '—', directionAffectation: p.directionAffectation || '—' })),
      itineraires: [{ordreEtape: 1, lieuDepart: document.getElementById('m-lieu-depart').value.trim(), lieuArrivee: document.getElementById('m-lieu-principal').value.trim(), dateDepart, dateArrivee: dateRetour, distanceKm: 0, idTransport: 1}],
      frais: []
    };
    try {
      const mission = API.createMission(payload);
      if (submit) {
        API.changerStatut(mission.idMission, 'SOUMIS');
        const missionDir = mission.idDirection;
        console.log('🔍 DEBUG - Mission créée, idMission:', mission.idMission, ', idDirection:', missionDir);
        
        const tousLesDirecteurs = API.getUsers().filter(u => u.role === 'DIRECTEUR' && u.actif !== false && u.idAgent);
        console.log('🔍 DEBUG - Directeurs disponibles:', tousLesDirecteurs.map(u => ({ login: u.login, idAgent: u.idAgent, idDirection: u.idAgent ? API.getAgent(u.idAgent)?.idDirection : null })));
        
        const directeur = tousLesDirecteurs
          .map(u => ({ user: u, agent: API.getAgent(u.idAgent) }))
          .find(x => x.agent && x.agent.idDirection === missionDir);
        
        if (directeur) {
          console.log('📤 DEBUG - Création validation pour:', directeur.agent.prenom, directeur.agent.nom, '(idAgent:', directeur.user.idAgent, ')');
          API.createValidation({
            idMission: mission.idMission,
            idValidateur: directeur.user.idAgent,
            niveau: 1,
            libelleEtape: 'Directeur → DAAJ',
            decision: 'EN_ATTENTE'
          });
          Utils.toast(`Mission transmise au Directeur ${directeur.agent.prenom} ${directeur.agent.nom}`, 'success', 5000);
        } else {
          console.error('❌ DEBUG - Aucun Directeur trouvé pour idDirection:', missionDir);
          Utils.toast('❌ Aucun Directeur trouvé pour cette direction', 'error', 6000);
        }
      } else {
        Utils.toast('Mission créée (brouillon)', 'success');
      }
      App.closeModal(); App.refresh();
    } catch (err) { Utils.toast(err.message, 'error'); }
  },

          <div class="modal-body">
            <div class="alert alert-info"><strong>Étape ${v.niveau}/${wf?.etapes?.length||'?'}</strong> — ${Utils.esc(v.libelleEtape||'')}<br>⚠️ Sélectionnez un véhicule et un chauffeur.</div>
            <div class="card" style="background:var(--gray-100);padding:14px;margin-bottom:16px">

                <select id="etab-vehicule" class="form-control" required size="6" style="height:auto"><option value="">— Sélectionner —</option>${vehiculesDispos.map(vh => `<option value="${vh.idVehicule}">${Utils.esc(vh.immatriculation)} — ${Utils.esc(vh.marque)} ${Utils.esc(vh.modele)}</option>`).join('')}</select>
                <small class="text-muted" id="etab-vehicule-count">${vehiculesDispos.length} disponible(s)</small>
              </div>
              <div class="form-group full-width"><label>👤 Chauffeur *</label>
                <input type="text" id="etab-chauffeur-search" class="form-control" placeholder="🔍 Rechercher..." style="margin-bottom:6px">
                <select id="etab-chauffeur" class="form-control" required size="6" style="height:auto"><option value="">— Sélectionner —</option>${chauffeurs.map(c => `<option value="${c.idAgent}">${Utils.esc(c.prenom)} ${Utils.esc(c.nom)} (${Utils.esc(c.matricule)})</option>`).join('')}</select>
                <small class="text-muted" id="etab-chauffeur-count">${chauffeurs.length} disponible(s)</small>

          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button>

            <button class="btn btn-success" onclick="Actions.etablirOM(${idValidation})">✓ Établir l'OM</button>
          </div>
        </div></div>`);
      Actions._initRecherche('etab-vehicule-search', 'etab-vehicule', 'etab-vehicule-count', vehiculesDispos.map(vh => ({value: String(vh.idVehicule), label: `${vh.immatriculation} — ${vh.marque} ${vh.modele}`, search: `${vh.immatriculation} ${vh.marque} ${vh.modele} ${vh.carburant||''}`})));
      Actions._initRecherche('etab-chauffeur-search', 'etab-chauffeur', 'etab-chauffeur-count', chauffeurs.map(c => ({value: String(c.idAgent), label: `${c.prenom} ${c.nom} (${c.matricule})`, search: `${c.prenom} ${c.nom} ${c.matricule} ${c.fonction||''}`})));
      return;
    }

    App.openModal(`
      <div class="modal-overlay active"><div class="modal" style="max-width:820px">
        <div class="modal-header"><h3>✍️ Traitement — ${Utils.esc(m.numeroOm)}</h3><button class="modal-close" onclick="App.closeModal()">×</button></div>
        <div class="modal-body">
          <div class="alert alert-warning"><strong>Étape ${v.niveau}/${wf?.etapes?.length||'?'}</strong> — ${Utils.esc(v.libelleEtape||'')}</div>
          <div class="card" style="background:var(--gray-100);padding:14px;margin-bottom:16px">
            <div><strong>Objet :</strong> ${Utils.esc(m.objet)}</div>
            <div><strong>Demandeur :</strong> ${demandeur ? Utils.esc(demandeur.prenom + ' ' + demandeur.nom) : '—'}</div>
            <div><strong>Période :</strong> ${Utils.formatDate(m.dateDepart)} → ${Utils.formatDate(m.dateRetour)}</div>
          </div>
          ${Actions.workflowViz(m.idMission)}
          <div class="form-group full-width" style="margin-top:16px"><label>Commentaire</label><textarea id="v-commentaire" class="form-control" rows="3"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="App.closeModal()">Annuler</button>
          <button class="btn btn-danger" onclick="Actions.deciderValidation(${idValidation}, 'REJETE')">✗ Rejeter</button>
          <button class="btn btn-success" onclick="Actions.deciderValidation(${idValidation}, 'VALIDE')">✓ Valider</button>
        </div>
      </div></div>`);
  },

  _initRecherche(searchId, selectId, countId, items) {
    const search = document.getElementById(searchId);
    const select = document.getElementById(selectId);
    const count = document.getElementById(countId);
    if (!search || !select) return;
    const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    search.addEventListener('input', () => {
      const q = norm(search.value.trim());
      const sv = select.value;
      const filtres = items.filter(o => !q || norm(o.search).includes(q));
      select.innerHTML = `<option value="">— Sélectionner —</option>` + filtres.map(o => `<option value="${o.value}" ${o.value === sv ? 'selected' : ''}>${Utils.esc(o.label)}</option>`).join('');
      if (count) count.textContent = `${filtres.length} / ${items.length}`;
      if (filtres.length === 1 && !sv) select.value = filtres[0].value;
    });
  },

  etablirOM(idValidation) {
    const v = API.getValidations().find(x => x.idValidation === idValidation); if (!v) return;
    const m = API.getMission(v.idMission); if (!m) return;
    const idVehicule = document.getElementById('etab-vehicule').value;
    const idChauffeur = document.getElementById('etab-chauffeur').value;
    const commentaire = (document.getElementById('v-commentaire')?.value || '').trim();
    if (!idVehicule || !idChauffeur) { Utils.toast('Sélectionnez véhicule et chauffeur', 'error'); return; }
    const vehicule = API.getVehicule(Number(idVehicule));
    const chauffeur = API.getAgent(Number(idChauffeur));
    if (!vehicule || !chauffeur) { Utils.toast('Introuvable', 'error'); return; }
    if (!Utils.confirm(`Confirmer OM ${m.numeroOm} ?\n🚗 ${vehicule.immatriculation}\n👤 ${chauffeur.prenom} ${chauffeur.nom}`)) return;
    try {
      API.updateVehicule(vehicule.idVehicule, { statut: 'AFFECTE' });
      const participantsActuels = m.participants || [];
      const deja = participantsActuels.find(p => p.idAgent === chauffeur.idAgent);
      const nouveaux = [...participantsActuels];
      if (!deja) { const dir = API.getDirection(chauffeur.idDirection); nouveaux.push({ idAgent: chauffeur.idAgent, roleMission: 'CHAUFFEUR', ordrePassage: nouveaux.length + 1, telephone: chauffeur.telephone || '—', directionAffectation: dir ? dir.codeDirection : '—' }); }
      API.updateMission(m.idMission, { participants: nouveaux, idVehicule: vehicule.idVehicule, idChauffeur: chauffeur.idAgent });
      API.updateValidation(idValidation, {decision: 'VALIDE', commentaire: commentaire || `OM établi — ${vehicule.immatriculation}`, dateDecision: new Date().toISOString()});
      API.changerStatut(m.idMission, 'OM_ETABLI');
      Utils.toast('✅ OM établi !', 'success');
      App.closeModal(); App.refresh();
      setTimeout(() => { if (Utils.confirm("Imprimer l'OM maintenant ?")) Printer.imprimerOrdreMission(m.idMission); }, 800);
    } catch (err) { Utils.toast(err.message, 'error'); }
  },

  deciderValidation(idValidation, decision) {
    const v = API.getValidations().find(x => x.idValidation === idValidation); if (!v) return;
    const m = API.getMission(v.idMission); if (!m) return;
    const wf = API.getWorkflow(m.idWorkflow);
    const commentaire = (document.getElementById('v-commentaire')?.value || '').trim();
    if (decision === 'REJETE' && !commentaire) { Utils.toast('Commentaire obligatoire', 'error'); return; }
    if (!Utils.confirm(`Confirmer : ${decision} ?`)) return;
    try {
      API.updateValidation(idValidation, {decision, commentaire: commentaire || null, dateDecision: new Date().toISOString()});
      if (decision === 'REJETE') { API.changerStatut(m.idMission, 'REJETE'); Utils.toast('Rejeté', 'warning'); }
      else {
        const etapes = wf?.etapes || [];
        const suivant = etapes.find(e => e.niveau === v.niveau + 1);
        if (suivant) {
          const validateur = Actions._trouverValidateurPourRole(suivant.roleRequis, m);
          if (validateur) {
            API.createValidation({idMission: m.idMission, idValidateur: validateur.idAgent, niveau: suivant.niveau, libelleEtape: suivant.libelle, decision: 'EN_ATTENTE'});
            if (v.niveau === 1) API.changerStatut(m.idMission, 'VALIDE_N1');
            else if (v.niveau === 2) API.changerStatut(m.idMission, 'VALIDE_N2');
            else if (v.niveau === 3) API.changerStatut(m.idMission, 'TRANSMIS_SSPA');
            Utils.toast('Validé — transmis', 'success');
          } else { API.changerStatut(m.idMission, 'VALIDE'); Utils.toast('Validé', 'warning'); }
        } else { API.changerStatut(m.idMission, 'OM_ETABLI'); Utils.toast('OM établi ✓', 'success'); }
      }
      App.closeModal(); App.refresh();
    } catch (err) { Utils.toast(err.message, 'error'); }
  },

  _trouverValidateurPourRole(roleRequis, mission) {
    const users = API.getUsers();
    const candidats = users.filter(u => u.role === roleRequis && u.actif !== false && u.idAgent);
    if (!candidats.length) return null;
    if (roleRequis === 'DIRECTEUR' || roleRequis === 'RELAIS') {
      const dansDir = candidats.find(u => { const a = API.getAgent(u.idAgent); return a && a.idDirection === mission.idDirection; });
      const choisi = dansDir || candidats[0];
      return {idAgent: choisi.idAgent, user: choisi};
    }
    return {idAgent: candidats[0].idAgent, user: candidats[0]};
  },

  renderVehicules() {
    const tbody = document.getElementById('vehicules-tbody'); if (!tbody) return;
    const fStatut = document.getElementById('filter-veh-statut')?.value || '';
    const fDir = document.getElementById('filter-veh-direction')?.value || '';
    const fSearch = (document.getElementById('filter-veh-search')?.value || '').trim().toLowerCase();
    const session = Auth.session();
    let list = Scope.demandesVehicules();
    if (fStatut) list = list.filter(d => d.statut === fStatut);
    if (fDir) list = list.filter(d => d.idDirection == fDir);
    if (fSearch) list = list.filter(d => { const dem = API.getAgent(d.idDemandeur); const n = dem ? `${dem.prenom} ${dem.nom}` : ''; return (d.numeroDemande||'').toLowerCase().includes(fSearch) || (d.objet||'').toLowerCase().includes(fSearch) || n.toLowerCase().includes(fSearch); });
    list.sort((a,b) => (b.dateCreation||'').localeCompare(a.dateCreation||''));
    if (!list.length) { tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted" style="padding:30px">Aucune demande</td></tr>'; return; }

  saveDemandeVehicule(submit = false) {
    const form = document.getElementById('form-demande-vehicule');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const id = document.getElementById('dv-id').value;
    const isEdit = !!id;
    const session = Auth.session();
    const agent = Auth.currentAgent();
    const dtDep = document.getElementById('dv-date-depart').value;
    const dtRet = document.getElementById('dv-date-retour').value;
    if (!dtDep || !dtRet || dtRet <= dtDep) { Utils.toast('Dates invalides', 'error'); return; }
    const dests = Actions.dvGetDestinations();
    if (!dests.length) { Utils.toast('Au moins une destination', 'error'); return; }
    const personnes = Actions.dvGetPersonnes();
    if (!personnes.length) { Utils.toast('Au moins une personne', 'error'); return; }
    const payload = { objet: document.getElementById('dv-objet').value.trim(), motif: document.getElementById('dv-motif').value.trim(), destination: dests[0], destinations: dests, personnesTransportees: personnes, nbPassagers: personnes.length, dateDepart: dtDep, dateRetour: dtRet };
    try {
      if (isEdit) { if (submit) { payload.statut = 'SOUMIS'; payload.dateSoumission = new Date().toISOString(); } API.updateDemandeVehicule(Number(id), payload); }
      else { payload.idDemandeur = session?.idAgent; payload.idCreateur = session?.idAgent; payload.idDirection = agent?.idDirection || 1; payload.dateCreation = new Date().toISOString(); payload.statut = submit ? 'SOUMIS' : 'BROUILLON'; if (submit) payload.dateSoumission = new Date().toISOString(); API.createDemandeVehicule(payload); }
      Utils.toast(submit ? 'Demande soumise' : 'Demande enregistrée', 'success');
      App.closeModal(); App.refresh();
    } catch (err) { Utils.toast(err.message, 'error'); }
  },

  confirmAffectation(id) {
    const idVehicule = document.getElementById('aff-vehicule').value;
    if (!idVehicule) { Utils.toast('Sélectionnez un véhicule', 'error'); return; }

  peutModifierDemande(d) {
    const s = Auth.session(); if (!s || !d) return {ok:false};
    const isOwner = s.idAgent != null && s.idAgent === d.idDemandeur;
    const isAdmin = s.role === 'ADMIN';
    const isGlobal = ['ADMIN','DAF','DAAJ','SSPA','DIRECTEUR'].includes(s.role);
    if (d.statut === 'BROUILLON' && (isOwner || isAdmin || isGlobal)) return {ok:true};
    if (d.statut === 'SOUMIS' && (isOwner || isAdmin || s.role === 'DIRECTEUR')) return {ok:true};
    if (d.statut === 'REFUSE' && (isAdmin || isOwner)) return {ok:true};
    return {ok:false};
  },

    document.querySelectorAll('#r-pages-grid input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => cb.closest('.permission-item').classList.toggle('checked', cb.checked)));
  },
  saveRole() {
    const id = document.getElementById('r-id').value;
    const code = document.getElementById('r-code').value.trim().toUpperCase();
    const libelle = document.getElementById('r-libelle').value.trim();
    const couleur = document.getElementById('r-couleur').value;
    const actif = document.getElementById('r-actif').value === 'true';
    const pages = Array.from(document.querySelectorAll('#r-pages-grid input[type=checkbox]:checked')).map(cb => cb.dataset.pageId);
    if (!pages.length) { Utils.toast('Au moins une page', 'error'); return; }
    try {
      if (id) { const r = API.getRole(Number(id)); const data = {libelle, couleur, actif, pages}; if (!r.isSystem) data.code = code; API.updateRole(Number(id), data); Utils.toast('Modifié', 'success'); }
      else { API.createRole({code, libelle, couleur, actif, pages}); Utils.toast('Créé', 'success'); }
      App.closeModal(); App.refresh();
    } catch (e) { Utils.toast(e.message, 'error'); }
  },

  renderStatistiques() {
    const stats = Scope.getStatistiques();
    const elStatut = document.getElementById('chart-statut');
    if (elStatut && typeof Chart !== 'undefined') new Chart(elStatut, {type:'doughnut', data:{labels:Object.keys(stats.byStatut), datasets:[{data:Object.values(stats.byStatut), backgroundColor:['#6c757d','#ffc107','#17a2b8','#0b3d91','#1e7e34','#c82333']}]}, options:{responsive:true, plugins:{legend:{position:'right'}}}});
    const elDir = document.getElementById('chart-direction');
    if (elDir && typeof Chart !== 'undefined') { const labels = Object.keys(stats.byDirection); new Chart(elDir, {type:'bar', data:{labels, datasets:[{label:'Missions', data:labels.map(l => stats.byDirection[l]), backgroundColor:'#0b3d91'}]}, options:{responsive:true}}); }
  },
  exportComplet() {
    try {
      const wb = XLSX.utils.book_new();
      const feuilles = [
        {nom:'Missions', data:Excel.missionsVersLignes()},
        {nom:'Demandes', data:Excel.demandesVehiculesVersLignes()},
        {nom:'Parc', data:Excel.parcAutoVersLignes()},
        {nom:'Agents', data:Excel.agentsVersLignes()},
        {nom:'Directions', data:Excel.directionsVersLignes()},
        {nom:'Destinations', data:Excel.destinationsVersLignes()}
      ];
      feuilles.forEach(f => { if (!f.data.length) return; const ws = XLSX.utils.json_to_sheet(f.data); XLSX.utils.book_append_sheet(wb, ws, f.nom.substring(0,31)); });
      XLSX.writeFile(wb, `export_complet_${new Date().toISOString().substring(0,10)}.xlsx`);
      Utils.toast('Export réussi', 'success');
    } catch (e) { Utils.toast('Erreur : ' + e.message, 'error'); }
  }
};

/* =====================================================
   10. HOOKS POST-RENDU
   ===================================================== */
function afterMissions() { ['filter-statut','filter-mission-direction','filter-search'].forEach(id => { const el = document.getElementById(id); if (el) { el.addEventListener('input', Actions.renderMissions); el.addEventListener('change', Actions.renderMissions); } }); Actions.renderMissions(); }
function afterVehicules() { ['filter-veh-statut','filter-veh-direction','filter-veh-search'].forEach(id => { const el = document.getElementById(id); if (el) { el.addEventListener('input', Actions.renderVehicules); el.addEventListener('change', Actions.renderVehicules); } }); Actions.renderVehicules(); }
function afterParcAuto() { ['filter-parc-auto','filter-parc-auto-statut','filter-parc-auto-direction'].forEach(id => { const el = document.getElementById(id); if (el) { el.addEventListener('input', Actions.renderParcAuto); el.addEventListener('change', Actions.renderParcAuto); } }); Actions.renderParcAuto(); }
function afterAgents() { ['filter-agent','filter-agent-direction','filter-agent-statut'].forEach(id => { const el = document.getElementById(id); if (el) { el.addEventListener('input', Actions.renderAgents); el.addEventListener('change', Actions.renderAgents); } }); Actions.renderAgents(); }
function afterDirections() { const el = document.getElementById('filter-direction'); if (el) el.addEventListener('input', Actions.renderDirections); Actions.renderDirections(); }
function afterDestinations() { const el = document.getElementById('filter-destination'); if (el) el.addEventListener('input', Actions.renderDestinations); Actions.renderDestinations(); }
function afterStatistiques() { setTimeout(() => Actions.renderStatistiques(), 50); }
function afterComptes() { ['filter-compte','filter-compte-role'].forEach(id => { const el = document.getElementById(id); if (el) { el.addEventListener('input', Actions.renderComptes); el.addEventListener('change', Actions.renderComptes); } }); Actions.renderComptes(); }
function afterRoles() { Actions.renderRoles(); }

/* =====================================================
   11. DÉMARRAGE
   ===================================================== */
document.addEventListener('DOMContentLoaded', async () => {
  try {
    await API.init();
    App.mount();
  } catch (e) {
    console.error('Erreur :', e);
    document.getElementById('root').innerHTML = `
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0b3d91;color:#fff;font-family:sans-serif;text-align:center;padding:20px">
        <div>
          <h1>❌ Impossible de se connecter au serveur</h1>
          <p>Vérifiez que le Back-end est démarré.</p>
          <p style="opacity:.7;font-size:14px;margin-top:20px">Erreur : ${e.message}</p>
        </div>
      </div>`;
  }
});
</script>
